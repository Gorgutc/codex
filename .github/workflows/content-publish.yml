# Source-SHA settled content publication. The Node batch runner owns all Git
# mutation so a moved main is rebuilt from a fresh detached head, never rebased.
name: content-publish

on:
  push:
    branches: [main]
    paths: ['content/**', 'assets/**']

concurrency:
  group: content-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete main history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # Markers and revert commits can touch content/, so do not run another
      # batch for our own trusted bot output.
      - name: Skip own bot commits
        id: guard
        run: |
          author="$(git log -1 --pretty=%an)"
          email="$(git log -1 --pretty=%ae)"
          subject="$(git log -1 --pretty=%s)"
          regen_subject_regex='^chore\(content\): regenerate site from content/ \[content-publish\]( \[source:[0-9a-f]{40}\])?$'
          revert_subject_regex='^revert\(content\): roll back content push after failed publish \[content-publish-revert\]( \[source:[0-9a-f]{40}\])?$'
          skip=false
          if [ "$author" = "github-actions[bot]" ] && [ "$email" = "41898282+github-actions[bot]@users.noreply.github.com" ] && { [[ "$subject" =~ $regen_subject_regex ]] || [[ "$subject" =~ $revert_subject_regex ]]; }; then skip=true; fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.guard.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      # Handles a complete unresolved first-parent source batch. Success
      # pushes one generated commit when required plus one exact terminal
      # marker per source SHA. A verified failure pushes the revert chain and
      # exits non-zero so the workflow remains visibly failed.
      - name: Settle unresolved content and asset sources
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/content-publish-batch.mjs
