# Beget production deployment.
#
# `content-publish` writes its rendered output with GITHUB_TOKEN. GitHub does
# not normally emit a second `push` workflow event for that token, so the
# `workflow_run` trigger below is the delivery bridge for both its successful
# `[content-publish]` commit and its automatic `[content-publish-revert]`.
name: deploy-beget

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [content-publish]
    types: [completed]
    branches: [main]

# A cancelled lftp mirror can leave the public tree half-updated. Queue every
# production deployment instead, including the workflow_run delivery bridge.
concurrency:
  group: deploy-beget-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Beget production
    runs-on: ubuntu-latest
    # The Actions UI permits selecting another ref for manual dispatch. The
    # production job is intentionally unavailable from any ref but main.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      # Every event resolves current main. A queued deployment must never send
      # an obsolete push SHA after a newer main revision already exists.
      - name: Checkout deployment revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git checkout --detach origin/main

      # The admin's source-only commit cannot be deployed: content-publish
      # first turns it into generated runtime files. It may include uploaded
      # media too, so its exact subject is the identity, not its path list.
      # A GitHub Actions bot is separately allowlisted to two fixed subjects.
      # Unknown bot commits fail closed for automatic triggers; an owner can
      # still recover current main through workflow_dispatch after the same
      # unresolved-admin guard.
      - name: Decide whether this revision needs deployment
        id: guard
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s)"
          author="$(git log -1 --format=%an)"
          email="$(git log -1 --format=%ae)"
          regen_subject_regex='^chore\(content\): regenerate site from content/ \[content-publish\]( \[source:[0-9a-f]{40}\])?$'
          revert_subject_regex='^revert\(content\): roll back content push after failed publish \[content-publish-revert\]( \[source:[0-9a-f]{40}\])?$'

          trusted_terminal() {
            local candidate_author="$1" candidate_email="$2" candidate_subject="$3"
            [ "$candidate_author" = 'github-actions[bot]' ] &&
              [ "$candidate_email" = '41898282+github-actions[bot]@users.noreply.github.com' ] &&
              { [[ "$candidate_subject" =~ $regen_subject_regex ]] || [[ "$candidate_subject" =~ $revert_subject_regex ]]; }
          }

          touches_source() {
            local sha="$1"
            if git rev-parse -q --verify "$sha^1" >/dev/null; then
              ! git diff --quiet "$sha^1" "$sha" -- content/ assets/
            else
              ! git diff-tree --root --quiet --no-commit-id -r "$sha" -- content/ assets/
            fi
          }

          skip=false
          allowed_publish_bot=false
          if trusted_terminal "$author" "$email" "$subject"; then
            allowed_publish_bot=true
          fi

          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            if [ "$allowed_publish_bot" = 'true' ]; then
              reason='allowlisted content-publish bot revision delivered by workflow_run'
            else
              skip=true
              reason='workflow_run head is not an allowlisted content-publish bot revision; skipped fail closed'
            fi
          else
            pending_source=false
            settlement_sha=''
            while IFS=$'\x1f' read -r sha history_author history_email history_subject; do
              if trusted_terminal "$history_author" "$history_email" "$history_subject"; then
                settlement_sha="$sha"
                break
              fi
              if touches_source "$sha"; then
                pending_source=true
                break
              fi
            done < <(git log --first-parent --format='%H%x1f%an%x1f%ae%x1f%s' HEAD)

            if [ "$pending_source" = 'true' ]; then
              skip=true
              reason='a content/assets source is newer than its latest trusted terminal settlement; waiting for content-publish'
            elif [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
              reason="manual owner-selected deployment after settlement ${settlement_sha:-none}"
            else
              reason="deployable revision after settlement ${settlement_sha:-none}"
            fi
          fi

          {
            echo "skip=$skip"
            echo "reason=$reason"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

          {
            echo '## Beget deployment'
            echo
            echo "- Revision: \`$(git rev-parse --short=12 HEAD)\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Decision: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

      # Missing secrets are an intentionally soft skip. This keeps normal CI
      # green for forks and before the owner has configured Beget, while making
      # the missing deployment contract visible in both logs and summary.
      - name: Check Beget deployment secrets
        id: secrets
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          BEGET_FTP_HOST: ${{ secrets.BEGET_FTP_HOST }}
          BEGET_FTP_USER: ${{ secrets.BEGET_FTP_USER }}
          BEGET_FTP_PASSWORD: ${{ secrets.BEGET_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in BEGET_FTP_HOST BEGET_FTP_USER BEGET_FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            missing_csv="$(IFS=,; echo "${missing[*]}")"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "missing=$missing_csv" >> "$GITHUB_OUTPUT"
            echo '::notice::секреты не настроены, деплой пропущен'
            {
              echo '- Деплой: секреты не настроены, деплой пропущен.'
              echo "- Missing secret names: \`$missing_csv\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install lftp
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      # lftp's --env-password keeps the password out of argv and the FTP URL.
      # Explicit FTP-over-TLS is required: a certificate failure is a deploy
      # failure rather than an insecure fallback.
      - name: Mirror public site to Beget over FTPS
        id: mirror
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          BEGET_FTP_HOST: ${{ secrets.BEGET_FTP_HOST }}
          BEGET_FTP_USER: ${{ secrets.BEGET_FTP_USER }}
          BEGET_FTP_PASSWORD: ${{ secrets.BEGET_FTP_PASSWORD }}
          EXPECTED_SHA: ${{ steps.guard.outputs.revision }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "$(git rev-parse origin/main)" != "$EXPECTED_SHA" ]; then
            echo 'deployed=false' >> "$GITHUB_OUTPUT"
            echo '::notice::main advanced while this deployment was queued; a newer trigger will deploy the resolved revision.'
            echo '- Deployment: skipped safely because main advanced before the FTPS transfer.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo 'deployed=true' >> "$GITHUB_OUTPUT"
          export LFTP_PASSWORD="$BEGET_FTP_PASSWORD"

          main_file_count="$(find . -type f \
            ! -path './.git/*' \
            ! -path './node_modules/*' \
            ! -path './test-results/*' \
            ! -path './playwright-report/*' \
            ! -path './runs/*' \
            ! -path './downloads/*' | wc -l | tr -d ' ')"
          downloads_file_count="$(find downloads -type f | wc -l | tr -d ' ')"
          {
            echo '- Mirror source files:'
            echo "  - Main tree (deleting stale repo files): \`$main_file_count\`"
            echo "  - downloads/ (additive only): \`$downloads_file_count\`"
          } >> "$GITHUB_STEP_SUMMARY"

          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:passive-mode true
          set ftp:prefer-epsv true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftps:initial-prot P
          set ssl:verify-certificate true
          set ssl:check-hostname true
          # Beget's FTP server (custom "BeGet FTP Server") accepts the TLS 1.3
          # control handshake but the PROT P data connections never establish
          # from the GnuTLS-built lftp on ubuntu-latest (TLS 1.3 session-ticket
          # reuse quirk): the first file dies with "max-retries exceeded".
          # Pinning TLS 1.2 restores classic session reuse on the data channel.
          set ssl:priority "NORMAL:-VERS-TLS1.3"
          # IPv4 only: the runner has no IPv6 egress, a stray AAAA answer would
          # stall every data connection until net:timeout.
          set dns:order "inet"
          set net:max-retries 2
          set net:timeout 20
          set net:reconnect-interval-base 5
          set xfer:clobber on
          # ftp:// + ssl-force = explicit FTP-over-TLS on port 21 (AUTH TLS),
          # which is what Beget serves. The ftps:// scheme would mean IMPLICIT
          # TLS on port 990 — closed on Beget, "Connection refused" before
          # login. SFTP fallback: change only this URL to sftp://, then remove
          # the ftp:ssl-* settings above; keep --env-password and both mirrors.
          open --env-password -u "$BEGET_FTP_USER" "ftp://$BEGET_FTP_HOST"

          # The remote target is the hosting docroot. Do not use ./ here: a
          # trailing target can create a worktree-name subdirectory in lftp.
          # --delete applies only to this public tree. In particular, never
          # add --delete-excluded: it would remove owner-managed downloads.
          mirror --reverse --delete --verbose --no-perms --max-errors=1 \
            --exclude-glob '.git/**' \
            --exclude-glob 'node_modules/**' \
            --exclude-glob 'test-results/**' \
            --exclude-glob 'playwright-report/**' \
            --exclude-glob 'runs/**' \
            --exclude-glob 'downloads/**' \
            ./ .

          # Download archives may be real owner-managed files on Beget while
          # this checkout only has placeholders. The additive pass uploads a
          # repository copy only when that remote path is missing; it never
          # deletes OR replaces an existing archive.
          mirror --reverse --only-missing --verbose --no-perms --max-errors=1 downloads/ downloads
          bye
          LFTP

          unset LFTP_PASSWORD

      # Normal shell requests are the production contract. Each shell must be
      # byte-identical and its own immutable generated-payload revisions must
      # resolve to the exact emitted bytes; no test-only query or no-cache
      # directive may bypass a stale carrier response here.
      - name: Set up Node for parity verification
        if: steps.mirror.outputs.deployed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify Beget parity after deployment
        id: parity
        if: steps.mirror.outputs.deployed == 'true'
        shell: bash
        env:
          PUBLIC_URL: https://codex.promo/
        run: |
          node scripts/verify-beget-parity.mjs --public-url "$PUBLIC_URL"

          {
            echo
            echo '### Post-deploy parity'
            echo '- Normal index.html and free-assets.html shells match local bytes.'
            echo '- Their emitted cards-data.js, fa-data.js, and i18n-data.js immutable revisions match local bytes.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write deployment summary
        if: always()
        shell: bash
        env:
          GUARD_SKIP: ${{ steps.guard.outputs.skip }}
          GUARD_REASON: ${{ steps.guard.outputs.reason }}
          SECRETS_READY: ${{ steps.secrets.outputs.ready }}
          MIRROR_OUTCOME: ${{ steps.mirror.outcome }}
          MIRROR_DEPLOYED: ${{ steps.mirror.outputs.deployed }}
          PARITY_OUTCOME: ${{ steps.parity.outcome }}
        run: |
          {
            echo
            echo '### Result'
            if [ "$GUARD_SKIP" = 'true' ]; then
              echo "- Skipped safely: $GUARD_REASON."
            elif [ "$SECRETS_READY" != 'true' ]; then
              echo '- Skipped softly: Beget deployment secrets are unavailable.'
            elif [ "$MIRROR_DEPLOYED" != 'true' ]; then
              echo '- Skipped safely: main advanced before transfer; the newer event owns deployment.'
            elif [ "$MIRROR_OUTCOME" = 'success' ] && [ "$PARITY_OUTCOME" = 'success' ]; then
              echo '- Deployed and verified: FTPS hashes, normal HTTPS shells, and emitted immutable payloads match local files.'
            else
              echo "- Deployment failed (mirror: ${MIRROR_OUTCOME:-not-run}; parity: ${PARITY_OUTCOME:-not-run})."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
